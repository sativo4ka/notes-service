version: '3.8'

services:
  db:
    image: postgres:16
    container_name: notes_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: notesdb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - notes_net
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: notes_api
    environment:
      - DATABASE_URL=postgres://postgres:mysecretpassword@db:5432/notesdb
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - notes_net

volumes:
  db_data:

networks:
  notes_net:
    driver: bridge